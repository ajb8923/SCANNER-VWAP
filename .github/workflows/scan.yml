name: Scanner VWAP
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"   # cada 5 min, sesión USA (cubre horario de verano e invierno)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-vwap
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests
      - run: python scanner_vwap.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json state.json
          git diff --cached --quiet || (git commit -m "scan" && git push)
